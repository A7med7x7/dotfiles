# tmux.conf — minimal but usable config
#
# Sections:
#   1. Prefix      — remap Ctrl+b to Ctrl+a (easier to reach)
#   2. Mouse       — click/scroll/resize with the mouse
#   3. History     — larger scrollback buffer
#   4. Copy mode   — vim-style keybindings
#   5. Windows     — number from 1, renumber on close
#   6. Status bar  — session name, windows, date/time

# --- 1. Prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- 2. Mouse ---
set -g mouse on

# --- 3. History ---
set -g history-limit 10000

# --- 4. Copy mode (vim keys) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- 5. Windows ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- 6. Status bar ---
set -g status-interval 5
set -g status-left "#[bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=white]%H:%M "
set -g status-justify left
